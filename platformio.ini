; ESP32 Energy Monitor - Monitor de consumo com clamp CT + tarifa horaria
; Plataforma: PlatformIO (espressif32@6.7.0 = Arduino core 2.0.17)
[env:esp32dev]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; particao com apps de 1.9MB (ESPAsyncWebServer + ArduinoJson > particao default)
board_build.partitions = min_spiffs.csv
lib_deps =
    me-no-dev/AsyncTCP@^1.1.1
    me-no-dev/ESPAsyncWebServer@^1.2.3
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4

; ---------------------------------------------------------------------------
; Upload OTA por Wi-Fi (ArduinoOTA). Reaproveita o firmware do env esp32dev.
; O alvo e' passado no CLI (IP ou hostname mDNS):
;     pio run -e esp32dev-ota -t upload --upload-port energia.local
; ou via tools/hil.py:
;     python ../../tools/hil.py flash esp32-energy-monitor \
;         --env esp32dev-ota --ota-ip energia.local --confirm
; Se a senha OTA estiver configurada, informe com --auth=<senha>.
; ---------------------------------------------------------------------------
[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = energia.local          ; padrao (mDNS); sobrescreva com --upload-port
; upload_flags = --auth=minhaSenhaOTA ; somente se houver senha OTA
